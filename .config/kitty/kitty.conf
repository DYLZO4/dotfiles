font_family JetBrainsMono Nerd Font Mono
font_size 10

disable_ligatures no
enable_audio_bell no

shell zsh
shell_integration disabled

cursor_shape block
cursor_blink_interval 0

remember_window_size no
initial_window_width 640
initial_window_height 480
window_padding_width 20

background_opacity 0.80
scrollbar_handle opacity 0
scrollbar_track_opacity 0
scrollbar_track_hover_opacity 0
confirm_os_window_close 0

sync_to_monitor no

include colors.conf

# START_AUTOGENERATED_TAB_STYLE
# Feel free to update these colors manually and remove these comments.
active_tab_foreground   #eeeeee
active_tab_background   #4d4f4c
inactive_tab_foreground #6e6e6e
inactive_tab_background #161718
# END_AUTOGENERATED_TAB_STYLE
